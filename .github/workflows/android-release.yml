name: Android release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/release.jks"
            {
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'storeFile=%s\n' "$HOME/.android/release.jks"
            } > android/key.properties
            echo "Release signing configured."
          else
            echo "No keystore secrets set; building with debug signing for now."
          fi

      - name: Build Android 7 universal APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/app-android7-universal-release.apk

      - name: Build Redmi Pad 2 (arm64-v8a) APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Redmi Pad 2 ships an arm64-v8a-only MediaTek SoC; a single-ABI APK
          # is dramatically smaller than the universal package.
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/app-redmi-pad-2-arm64-release.apk

      - name: Attach artifacts to git tag (if a tag pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: private-agent-android
          path: dist/*.apk
